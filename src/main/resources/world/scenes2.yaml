# Alternate authored world seed — "The Tide-Wreck Coast", a fog-bound fishing hamlet
# and the sea caves beneath it. A larger graph than scenes.yaml, kept as a *separate*
# world so the curated scenes.yaml (which the tests pin) stays untouched.
#
# Load it instead of the default by passing the world to the launcher:
#   .claude/scripts/run-app.sh --world scenes2.yaml
# (which sets game.world.seed-location=classpath:world/scenes2.yaml). The entry scene is
# scn1, matching the default game.player.starting-scene-id, so no other config is needed.
#
# Same rules as scenes.yaml: data flows in through the InitializeGame use case (the
# validity gate), ids are authored short keys, exit `target`s reference scenes by id and
# may point forward, and items are rare templates spawned idempotently at seed time.

scenes:
  - id: scn1
    name: Harbor Steps
    shortDescription: Weed-slick stone steps rising from the water.
    fullDescription: >
      Green-black steps climb out of a sea that breathes against them. Fog sits on the
      water like a lid. A market lane runs north; a tarred wharf stretches east.
    exits:
      - name: north
        target: scn2
      - name: east
        target: scn3

  - id: scn2
    name: Fish Market
    shortDescription: A shuttered fish market.
    fullDescription: >
      Empty trestle tables still smell of brine and old catch. Gulls have the run of
      the place now. Lanes lead back south, west into a row of cottages, and north to
      a leaning chapel.
    exits:
      - name: south
        target: scn1
      - name: west
        target: scn4
      - name: north
        target: scn5

  - id: scn3
    name: Salt Wharf
    shortDescription: A tarred wharf over black water.
    fullDescription: >
      Mooring rings rust along a wharf whose planks flex underfoot. West are the harbor
      steps; north, a squat lighthouse holds the headland.
    exits:
      - name: west
        target: scn1
      - name: north
        target: scn6

  - id: scn4
    name: Net-Menders' Row
    shortDescription: A row of net-menders' cottages.
    fullDescription: >
      Half-mended nets hang stiff with salt between the doorways. On an overturned skiff,
      an old net-mender deals cards for anyone with time to lose. The only way back is
      east to the market.
    exits:
      - name: east
        target: scn2
    mini-games: blackjack  # what can be played here (comma-separated, closed vocabulary)

  - id: scn5
    name: The Drowned Chapel
    shortDescription: A chapel half-claimed by the tide.
    fullDescription: >
      Brackish water stands ankle-deep down the nave; the altar is furred with weed.
      A broken flagstone opens onto a stair going down. The market lies back south.
    exits:
      - name: south
        target: scn2
      - name: down
        target: scn8

  - id: scn6
    name: Lighthouse Base
    shortDescription: The foot of a squat lighthouse.
    fullDescription: >
      The lighthouse door has rotted off its frame. A spiral stair winds up to the
      lantern room; another, cruder stair drops away below. The wharf is back south.
    exits:
      - name: south
        target: scn3
      - name: up
        target: scn7
      - name: down
        target: scn8

  - id: scn7
    name: Lantern Room
    shortDescription: The lighthouse lantern room.
    fullDescription: >
      The great lens is shattered, but the view over the fog-bound coast is total. The
      only way is back down.
    exits:
      - name: down
        target: scn6

  - id: scn8
    name: Smugglers' Stair
    shortDescription: A crude stair cut into the rock.
    fullDescription: >
      Hand-cut steps sweat with seawater, worn by boots that meant not to be seen. They
      climb to the chapel and the lighthouse, and descend toward the sound of surf.
    exits:
      - name: up
        target: scn6
      - name: north
        target: scn5
      - name: down
        target: scn9

  - id: scn9
    name: Sea Cave
    shortDescription: A booming sea cave.
    fullDescription: >
      Each swell drives air into the cave with a hollow boom. The smugglers' stair rises
      behind you; a low gap leads west into a quieter grotto.
    exits:
      - name: up
        target: scn8
      - name: west
        target: scn10

  - id: scn10
    name: Tide Pool Grotto
    shortDescription: A still grotto of tide pools.
    fullDescription: >
      Beyond the cave's roar lies a vault of clear tide pools, the water lit from below
      by some pale, drifting glow. The booming cave is back east.
    exits:
      - name: east
        target: scn9

# Authored items — tuned to exercise `examine` and its disambiguation. Every spawn is
# *certain* (chance 1/1) and lands in the starting scene scn1 (a single candidate scene,
# so the uniform pick can only choose scn1), so a fresh game shows them all on the ground
# at once — no navigation needed to test.
#
# Three ambiguity surfaces, all in scn1:
#   - `examine lantern` matches itm1/itm2/itm3  -> a 3-way disambiguation menu
#   - `examine rusty`   matches itm1/itm4        -> a 2-way menu (cross-cutting the lanterns)
#   - `examine storm` / `compass` / `brass`      -> exactly one match -> straight to the reveal
#   - `examine float`   matches the two itm5 instances -> a menu of identical-looking entries
#                       (distinct ids behind the same description)
#   - `examine spoon`                            -> no match
#
# Containment surface (also certain, also scn1): itm6 is a container that always spawns,
# always holding an instance of the contained-only itm7 (`contains` chance 1/1) —
#   - `examine chest`   -> the container reveal, listing the whale tooth inside
#   - `examine tooth`   -> no match: contained items are not on the ground (they surface
#                          once `take` learns to reach into containers)
#   - `take chest`      -> succeeds: itm6 is authored `portable: true`, so the chest — and
#                          the tooth inside it, which references the chest, not the scene —
#                          travels in your keeping (drop it elsewhere and examine it there)
#
# NOTE: spawning is idempotent — a restart never re-rolls. To see these on a DB that already
# seeded a previous world, start from a clean play database first.
items:
  - id: itm1
    shortDescription: A rusty ship's lantern.
    fullDescription: >
      A heavy iron ship's lantern, its panes clouded with salt and its body bled orange
      with rust. The wick is long gone.
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1

  - id: itm2
    shortDescription: A cracked storm lantern.
    fullDescription: >
      A storm lantern with a star-cracked glass globe. It would gutter in the first gust,
      yet it has plainly weathered many.
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1

  - id: itm3
    shortDescription: A salt-pitted hand lantern.
    fullDescription: >
      A small tin hand lantern, pitted grey-white where the salt air has gnawed at it for
      season after season.
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1

  - id: itm4
    shortDescription: A rusty brass compass.
    fullDescription: >
      A brass pocket compass gone green and rust-streaked. The needle swings free,
      settling on no north you can trust.
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1

  - id: itm5
    shortDescription: A pale glass net-float.
    fullDescription: >
      A hand-blown glass float, pale sea-green and clouded, the kind that once held a
      fishing net up against the swell.
    spawn:
      scenes: scn1
      chance: 1/1
      max: 2

  - id: itm6
    shortDescription: A barnacled sea chest.
    fullDescription: >
      A sailor's sea chest crusted white with barnacle, its rope handles rotted to
      stubs. The hasp hangs open, long since forced by someone else.
    container: true
    portable: true         # explicitly authored — this chest CAN be carried off, contents and all
    contains:
      - item: itm7         # the whale tooth is always inside ...
        chance: 1/1        # ... rolled certainly, once per spawned chest
    spawn:
      scenes: scn1
      chance: 1/1          # the chest itself always spawns
      max: 1

  # Contained-only: no `spawn` rule, so it never lies on the ground — it exists solely
  # through the sea chest's `contains` roll above.
  - id: itm7
    shortDescription: A scrimshaw whale tooth.
    fullDescription: >
      A whale tooth etched with a tiny, patient scene: a three-masted ship going
      down by the bow while small boats pull away.

  # Death drops (see npcs.corpse below) — minted only when their NPC is slain; no `spawn`
  # rule, anchored by the container default. Two corpse flavors for testing:
  #   - `hit fishwife` until slain -> her corpse drops CERTAINLY holding the gutting-knife
  #     (`examine corpse` reveals it — the guaranteed looted-corpse surface)
  #   - `hit lamplighter` until slain -> his corpse holds nothing (`examine` says it is empty)
  #   - the watchman authors NO corpse — slain, he simply vanishes from the steps
  - id: itm8
    shortDescription: The corpse of a hunched fishwife.
    fullDescription: >
      The fishwife lies in her stiff oilskins, finally facing away from the water.
      Her hands are curled as though still working a catch.
    container: true
    contains:
      - item: itm9         # her gutting-knife stays with the body ...
        chance: 1/1        # ... certainly, once per slaying

  # Contained-only: exists solely through the fishwife's corpse above.
  - id: itm9
    shortDescription: A well-worn gutting-knife.
    fullDescription: >
      A short curved blade thinned by decades of whetstone, its wooden grip worn to
      the shape of one particular hand.

  - id: itm10
    shortDescription: The corpse of a blind lamplighter.
    fullDescription: >
      The lamplighter lies gaunt and still, tarred pole beside him. Whatever tune he
      hummed, the tide answers it alone now. He carried nothing else.
    container: true

# Authored NPCs — like the items, tuned so you actually see them without hunting. All three
# spawn *certainly* (chance 1/1, max 1) into the starting scene scn1, so a fresh game
# lists them under "Also here:" the moment you `look`. Each then wanders on the NPC ticker,
# which fires every second: `moveChance` is the per-tick odds it steps to a random adjacent
# scene, so watch over tens of seconds and they drift off into the fog (and, if you follow,
# arrive after you). The odds are tuned to the 1s tick — 1/30 ≈ a move every ~30s.
#
# NOTE: spawning is idempotent — a restart never re-rolls, and the guard is world-wide, so
# start from a clean play database to see them on a DB that already seeded another world.
npcs:
  - id: npc1
    shortDescription: A hunched fishwife.
    fullDescription: >
      A stooped old woman in oilskins gone stiff with salt, a gutting-knife still loose in
      one hand. She watches the water more than she watches you.
    moveChance: 1/30       # wanders fairly often (~every 30s at the 1s tick)
    attackChance: 1/3      # gutting-knife handy — hits back hard once provoked (~every ~3s)
    hitPoints: 15          # health pool it spawns at; a strike does 1..10 damage
    corpse: itm8           # slain, she certainly leaves her knife on the body (see items)
    spawn:
      scenes: scn1
      chance: 1/1          # certain to spawn
      max: 1

  - id: npc2
    shortDescription: A blind lamplighter.
    fullDescription: >
      A gaunt man feeling his way along the walls with a tarred pole, though every lamp on
      this coast went dark years ago. He hums a tune the tide seems to answer.
    moveChance: 1/50       # wanders, but lingers longer (~every 50s)
    attackChance: 1/6      # frail and blind — flails back only now and then once provoked
    hitPoints: 12          # health pool it spawns at; a strike does 1..10 damage
    corpse: itm10          # slain, he leaves an empty-handed corpse (see items)
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1

  - id: npc3
    shortDescription: A barnacled harbor-watchman.
    fullDescription: >
      An old man so long at his post he seems grown to it, oilskins crusted with barnacle
      and weed. He has not left these steps in living memory, and does not mean to start.
    moveChance: 1/200      # moves very rarely — all but rooted to the spot (~every few minutes)
    attackChance: 1/4      # stolid but stubborn — swings steadily once roused
    hitPoints: 18          # health pool it spawns at; a strike does 1..10 damage
    # no `corpse:` — slain, the watchman leaves nothing behind (the corpse-less path)
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1
