# Authored world seed — a small, connected scene graph.
#
# This is data, not schema: it flows into the world *through the domain* (the
# InitializeGame use case constructs and validates the aggregates), never
# via Flyway, which owns DDL only.
#
# Ids are authored short keys (the body the SceneId value object carries, e.g.
# "scn1"); exit `target`s reference other scenes by that id. Targets may point
# *forward* to scenes defined later in this file — resolution is order-independent
# because exit.target_scene_id carries no foreign key, and whether every target
# resolves is a use-case rule (two-pass validation), not a parse-time concern here.
#
# Locks. An exit may carry a `lock:` — a handle naming the lock that bars it — and
# an optional `lockedDescription:`, the line shown when a move through it is
# refused (a generic line is shown when none is authored; a `lockedDescription:`
# without a `lock:` is rejected at init). A locked exit is passed only by a mover
# carrying an item whose `opens:` (see items) names that same handle; NPCs carry
# nothing and never pass one. There is no locked/unlocked state and no unlock verb:
# a lock is a fact of the exit, the key a fact of the item, and whether a mover
# passes is decided each time from what it carries. A lock no item opens is valid —
# a sealed door. Locks are per exit: the way back down a locked stair is unlocked
# unless it carries a lock of its own.

scenes:
  - id: scn1
    name: Old Gate
    shortDescription: A weathered stone archway.
    fullDescription: >
      The gate's iron hinges have long since rusted shut against the open sky.
      A path runs north into a courtyard; a low door breaks the east wall.
    exits:
      - name: north
        target: scn2      # forward reference — scn2 is defined below
      - name: east
        target: scn3      # forward reference

  - id: scn2
    name: Courtyard
    shortDescription: A grass-cracked courtyard.
    fullDescription: >
      Weeds push between the flagstones of what was once a drilling yard. Stone
      stairs spiral up to a watchtower; the gate stands open to the south. Lamplight
      and the smell of woodsmoke spill from a low doorway in the west wall.
    exits:
      - name: south
        target: scn1      # back-edge, closing the loop with the gate
      - name: up
        target: scn4      # forward reference
      - name: west
        target: scn5      # forward reference — the inn

  - id: scn3
    name: Armoury
    shortDescription: A plundered armoury.
    fullDescription: >
      Empty weapon racks line the walls and a film of dust covers the floor.
      At an upturned crate in the corner, a grizzled dealer riffles a worn deck
      of cards, waiting for a player. The only way out is back west through the gate.
    exits:
      - name: west
        target: scn1      # back-edge
    mini-games: blackjack  # what can be played here (comma-separated, closed vocabulary)

  - id: scn4
    name: Watchtower
    shortDescription: A windswept watchtower.
    fullDescription: >
      From the parapet the whole ruined keep is laid out below. A narrow stair
      descends back down into the courtyard.
    exits:
      - name: down
        target: scn2      # back-edge

  - id: scn5
    name: The Crooked Lantern
    shortDescription: The common room of a cramped inn.
    fullDescription: >
      A fire crackles in a soot-black hearth, and a few rickety tables crowd the
      floor between it and a long plank counter. Behind the counter a narrow stair
      climbs to a door at the top. The courtyard lies back east.
    exits:
      - name: east
        target: scn2      # back-edge to the courtyard
      - name: up
        target: scn6      # forward reference — the guest room
        lock: guest-room  # the lock's handle; itm6 (below) opens it
        lockedDescription: The door at the head of the stair is locked.

  - id: scn6
    name: Guest Room
    shortDescription: A low-beamed guest room under the eaves.
    fullDescription: >
      A narrow bed with a straw mattress, a washstand and a shuttered window under
      the slope of the roof. The stair leads back down to the common room.
    exits:
      - name: down
        target: scn5      # back-edge — no lock: the door opens freely from inside

# Authored items. Each is a *template*: its `spawn` rule places 0..max instances
# into randomly chosen candidate scenes (one chance roll per try). Instances are
# minted fresh generated ids at seed time; the `id` here is only an authoring
# handle. Spawning is idempotent — a restart never re-rolls.
#
# A template may be a *container* (`container: true`): its `contains` list declares
# what may lie inside, referencing other items by authoring handle. Each spawned
# container instance rolls each entry once — a hit mints an instance of the
# referenced template inside that very container. A contained target must not be a
# container itself (no authored nesting). The `spawn` rule is optional: an item
# without one never spawns onto the ground and appears only inside containers.
#
# The placement routes are INDEPENDENT. `spawn.max` bounds only the ground-spawn
# tries of its own rule; containment rolls never count against the contained item's
# spawn rule (nor vice versa). A template's total world population is therefore its
# ground placements (at most `spawn.max`) PLUS at most one instance per `contains`
# entry per spawned container instance — e.g. up to 3 ground daggers plus 1 more per
# chest below. Cardinality is authored where the placement is authored: the spawn
# rule owns the ground, each container's `contains` entry owns that container.
#
# A third placement route is the DEATH DROP: an item referenced by an NPC's `corpse:`
# (below) is minted when that NPC is slain — one instance per slaying, its `contains`
# rolled per corpse like any container fill. A corpse template must be a container
# and must NOT author a `spawn` rule (it would also lie around at init); left
# unauthored `portable`, it defaults to anchored like any container, so a corpse
# cannot be carried off.
#
# Portability (`portable`, optional): whether `take` may carry the item off. Defaults
# are kind-sensitive — a plain item is portable unless authored `portable: false`; a
# CONTAINER is NOT portable unless authored `portable: true`. A transportable container
# (its contents ride along, since they reference the container by id, not by scene) is
# a deliberate authored fact, never an accident of the model.
#
# Keys (`opens`, optional): the handle of the lock the item opens — it must name a
# `lock:` declared on some exit above, or init is refused. Carrying the item (held
# directly, not inside a carried container) lets the player through every exit
# barred by that lock. Unauthored = the item opens nothing.
#
# Currency (`currency`, optional): whether the item is money. There is ONE currency and no
# denominations, so every currency item counts as exactly one coin toward a price, whatever
# its template — the flag is all there is to being money. Nothing counts coins yet (buying is
# a later phase); the fact is authored and persisted now so the phase that spends them has
# something to spend. It is subject to an invariant: a currency item is neither a `container`
# (money that holds other things is a purse, whose contents would ride along uncounted) nor
# `portable: false` (money bolted to the ground cannot be paid), so `currency: true` together
# with either is rejected at init.
items:
  - id: itm1
    shortDescription: A rusty dagger.
    fullDescription: >
      A plain iron dagger, rusty but looks like it can still be used. There is an
      inscription in an unknown language running down the blade.
    spawn:
      scenes: scn2, scn3   # scenes where the item can spawn
      chance: 12/50        # chance of spawning on each try
      max: 3               # maximum number of spawn tries

  - id: itm2
    shortDescription: A tarnished silver ring.
    fullDescription: >
      A slim band of tarnished silver, its surface worn smooth. It is warm to the
      touch, though nothing here could have warmed it.
    spawn:
      scenes: scn3, scn4
      chance: 1/2
      max: 2

  - id: itm3
    shortDescription: A copper coin.
    currency: true               # counts as one coin toward a price (see npcs.offers below)
    fullDescription: >
      A single dull copper coin, the kind that once bought bread at the gate market. One face
      is worn smooth, where a thumb has turned it over and over.
    spawn:
      scenes: scn1
      chance: 40/50
      max: 4

  - id: itm4
    shortDescription: An oak chest.
    fullDescription: >
      A heavy oak chest banded in black iron, its lid scarred by old pry-marks.
      Whoever forced it last did not bother to lock it again.
    container: true
    # no `portable:` — a container defaults to anchored, so `take chest` is refused
    contains:
      - item: itm1         # the rusty dagger may lie inside
        chance: 1/45       # rolled once per spawned chest instance
    spawn:
      scenes: scn1
      chance: 1/1
      max: 1

  # Death drop: no `spawn` rule and referenced by no `contains` — it is minted only when
  # the hooded wanderer is slain (see npcs.corpse below). A container (its loot lies on
  # the body); `portable` unauthored, so it is anchored — a corpse cannot be carried off.
  - id: itm5
    shortDescription: The corpse of a hooded wanderer.
    fullDescription: >
      The wanderer lies where it fell, its travel-worn cloak settled over it like a
      shroud. Whatever drove it around these ruins has finally let it rest.
    container: true
    contains:
      - item: itm2         # the tarnished silver ring may be on the body
        chance: 1/2        # rolled once per slaying

  # TEMPORARY placement: the guest-room key lies on the inn floor with certainty *and* is on
  # offer from the keeper below (npcs npc2). Phase 3 of the inn scenario removes the ground spawn,
  # leaving the offer as the only route to the key; until then both routes coexist — deliberately
  # allowed by the offer gate, which asks only that an offered item be carryable and not a container.
  - id: itm6
    shortDescription: A small brass key.
    fullDescription: >
      A small brass key on a loop of frayed red cord. A wooden tag hangs from it,
      burned with the outline of a lantern.
    opens: guest-room      # the handle of the lock this item opens (see scn5's exit up)
    spawn:
      scenes: scn5
      chance: 1/1
      max: 1

# Authored NPCs. Each is a *template*: its `spawn` rule places 0..max instances into
# randomly chosen candidate scenes (one chance roll per try), exactly like items.
# Spawned NPCs then wander on a background metronome that fires every second — each tick,
# `moveChance` decides whether the NPC steps to a random adjacent scene, so it is the
# per-tick odds (1/40 ≈ a move every ~40s). Instances are minted fresh generated ids at
# seed time; the `id` here is only an authoring handle. Spawning is idempotent — a restart
# never re-rolls, and NPCs resume from their last position. (One deliberate exception:
# slain NPCs are DELETED — their corpses remain — so a world whose every NPC has been
# slain re-spawns fresh instances on the next boot; the fallen's corpses accumulate.)
#
# `corpse:` (optional) names the item template minted as this NPC's corpse when an
# instance is slain — one corpse per slaying, dropped in the scene where it fell, its
# `contains` rolled there and then. Unauthored = the NPC leaves no corpse.
#
# `sayings:` (optional) lists the lines the NPC may answer with when the player talks to
# it (`talk <npc>`); one is picked uniformly at random each time, so repeat a line to
# weight it. Unauthored = the NPC has nothing to say (it acknowledges you and stays
# silent). A hostile NPC — one the player has struck — refuses to talk regardless of its
# lines: the combat stance outranks eloquence.
#
# `offers:` (optional) lists what the NPC is prepared to hand over for coins. Each entry is
# `{id, name, price, item}`: the offer's `id` is its handle, unique within this NPC; `name` is
# how it reads to the player, a sentence like an item's short description; `price` counts
# COINS (one each, from any item authored `currency: true` above); and `item` is the authoring
# handle of the item delivered on purchase — which must resolve to an item that is neither a
# `container` nor anchored (ware changes hands, so it must be a carryable single thing). It MAY
# have a `spawn` rule of its own: the key below both lies on the inn floor and is for sale.
# Nothing buys anything yet (phase 3 adds the verb) and nothing renders an offer (phase 4 adds
# the pitch); an offer is a standing authored fact, with no stock and no sold-out state.
# Unauthored = the NPC sells nothing.
npcs:
  - id: npc1
    shortDescription: A hooded wanderer.
    fullDescription: >
      A figure in a travel-worn hooded cloak, face lost in shadow. It moves without
      hurry, as though it has walked these ruins many times before.
    moveChance: 1/40       # per-tick odds of wandering (~a move every 40s at the 1s tick)
    attackChance: 1/3      # once provoked, per-tick odds of striking back (~a blow every ~3s)
    hitPoints: 20          # health pool it spawns at; a strike does 1..10 damage
    corpse: itm5           # slain, it leaves the wanderer's corpse (see items)
    sayings:               # what it answers when talked to — one line picked at random
      - You walk the same stones I walked. Mind where they lead.
      - The gate was shut long before the hinges rusted. Ask yourself by whom.
      - I have counted the steps to the tower a thousand times. The number changes.
    spawn:
      scenes: scn1         # scenes where the NPC can spawn
      chance: 1/1          # chance of spawning on each try
      max: 1               # maximum number of spawn tries

  - id: npc2
    shortDescription: A stout innkeeper.
    fullDescription: >
      A broad-shouldered woman in a flour-dusted apron, sleeves rolled to the
      elbow. She keeps one eye on the hearth and the other on whoever comes in.
    moveChance: 0/1        # never wanders — she keeps her counter
    attackChance: 1/4
    hitPoints: 25
    sayings:
      - Rooms are upstairs. The door's locked — I keep it that way.
      - A bed for the night? Coin first, then we talk about the room.
      - Fire's warm and the stew is yesterday's. The room upstairs is the best in the keep, which says little.
    offers:
      - id: room               # the offer's handle, unique within this NPC
        name: A room for the night.
        price: 2               # in coins — itm3, one coin each
        item: itm6             # delivered on purchase: the guest-room key
    spawn:
      scenes: scn5
      chance: 1/1
      max: 1
